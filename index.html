<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>Simon</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
</head>

<body>
 <header>
  <h1 id="level-title">Press a key to Start</h1>
  </header>
   <main>
  <div class="container">
    <div class="row">

      <div type="button" id="green" class="btn green" >
  
      </div>

      <div type="button" id="red" class="btn red ">
   
      </div>
    </div>

    <div class="row">

      <div type="button" id="yellow" class="btn yellow ">
      </div>
      <div type="button" id="blue" class="btn blue">
   
      </div>

    </div>

  </div>
  <!-- For Mobile Users  -->
  <div style="margin:0px ;text-align:center;">
        <button style="display:inline-block;padding:12px 28px;font-size:16px;background:#3e55af;color:#fff;text-decoration:none;border-radius:6px;font-weight:600;">Start</button>
      </div>
  <div style="margin-top:30px;text-align:center;">
        <a href="instruction.html" style="display:inline-block;padding:12px 28px;font-size:16px;background:#3e55af;color:#fff;text-decoration:none;border-radius:6px;font-weight:600;">Help</a>
      </div>
 <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="./game.js"></script>

</main>
 <footer>
    <p>© 2026 Simon Game Guide | Designed By Harshit Singh</p>
  </footer>
  </body>
</html>
